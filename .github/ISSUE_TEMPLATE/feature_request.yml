name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow, not just the solution, helps the most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could OpsTrellis help?
