name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpsTrellis version
      description: Settings → About, or `opstrellis --version`.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Transcription provider and model
      placeholder: "Local Moonshine Tiny, Deepgram nova-3, …"
  - type: textarea
    id: logs
    attributes:
      label: Log lines (optional)
      description: Settings → About → Show logs. The log has timings and errors, never what you said. Remove anything you don't want to share.
      render: text
